name: Tag Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

env:
  ORG: team-deepiri
  CASCADE_REPO: deepiri-cascade

permissions:
  contents: write

jobs:
  check-tags:
    runs-on: ubuntu-latest
    outputs:
      tags_json: ${{ steps.check.outputs.tags_json }}
      has_tags: ${{ steps.check.outputs.has_tags }}
    steps:
      - name: Restore tag state
        uses: actions/cache/restore@v4
        with:
          path: tag_state.json
          key: tag-state-${{ github.run_id }}
          restore-keys: |
            tag-state-

      - name: Check for new tags
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import json
          import urllib.request

          org = os.environ["ORG"]
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def gh_get(url, params=None):
              if params:
                  query = "&".join(f"{k}={v}" for k, v in params.items())
                  url = f"{url}?{query}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          state_file = "tag_state.json"

          # Load previous state
          old_state = {}
          try:
              with open(state_file) as f:
                  old_state = json.load(f)
          except Exception:
              pass

          # Get all repos
          repos = []
          page = 1
          while True:
              try:
                  data = gh_get(
                      f"https://api.github.com/orgs/{org}/repos",
                      {"page": page, "per_page": 100, "type": "all"},
                  )
              except Exception:
                  break
              if not data:
                  break
              repos.extend([r["name"] for r in data])
              page += 1

          new_tags = []
          current_state = {}

          # Check each repo for latest tag
          for repo in repos:
              try:
                  tags = gh_get(
                      f"https://api.github.com/repos/{org}/{repo}/tags",
                      {"per_page": 1},
                  )
              except Exception:
                  continue
              if tags:
                  tag = tags[0]["name"]
                  current_state[repo] = tag
                  if repo in old_state:
                      if tag != old_state[repo]:
                          new_tags.append({"repo": repo, "tag": tag})
                          print(f"New tag: {repo}: {tag}")
                  else:
                      print(f"First seen tag for {repo}: {tag}")

          # Output tags. has_tags is the gate for the `cascade` job -- do not
          # gate on `fromJson(tags_json).length`, an empty/miswritten job output
          # makes that expression skip the job silently instead of failing loudly.
          tags_json = json.dumps(new_tags)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tags_json={tags_json}\n")
              f.write(f"has_tags={'true' if new_tags else 'false'}\n")

          # Save state for next run
          with open(state_file, "w") as f:
              json.dump(current_state, f)

          print(f"tags_json={tags_json}")
          print(f"New tags found: {len(new_tags)}")
          EOF

      - name: Save tag state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: tag_state.json
          key: tag-state-${{ github.run_id }}

  cascade:
    needs: check-tags
    if: ${{ needs.check-tags.outputs.has_tags == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check-tags.outputs.tags_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A repository_dispatch sent with the default GITHUB_TOKEN does NOT start a
      # new workflow run (GitHub's recursion guard), so this fallback never
      # actually triggered cascade.yml. Mint the cascade GitHub App token
      # instead -- same App the Cloudflare worker uses.
      - name: Mint cascade App token
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_OWNER: ${{ env.ORG }}
        run: |
          python -m pip install --quiet PyJWT cryptography httpx
          python scripts/mint_github_app_token.py

      - name: Trigger cascade for ${{ matrix.repo }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
        run: |
          payload="$(jq -n --arg repo "$REPO" --arg tag "$TAG" \
            '{event_type: "cascade-trigger", client_payload: {repo: $repo, tag: $tag}}')"
          curl -sSf -X POST \
            "https://api.github.com/repos/${ORG}/${CASCADE_REPO}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"
          echo "Dispatched cascade-trigger for ${REPO} ${TAG}"
