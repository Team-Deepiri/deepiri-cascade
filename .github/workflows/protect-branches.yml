name: Protect Default Branches

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview only; no changes are made. Start here.'
        type: boolean
        default: true
      repos:
        description: 'Optional comma-separated repo names (default: every org repo)'
        type: string
        required: false
        default: ''
      require-pr:
        description: 'Require a pull request before merging (blocks direct pushes)'
        type: boolean
        default: false
      required-checks:
        description: 'Optional comma-separated status checks for repos that run CI (default: none)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The default GITHUB_TOKEN is scoped to this repo and has no admin
      # rights there; branch protection needs repo admin. Use the cascade
      # GitHub App token (Administration: write) to apply rules org-wide.
      - name: Mint cascade App token
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_OWNER: team-deepiri
        run: |
          python -m pip install --quiet PyJWT cryptography httpx
          python scripts/mint_github_app_token.py

      - name: Protect default branches
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: team-deepiri
          DRY_RUN: ${{ inputs.dry-run }}
          REPOS: ${{ inputs.repos }}
          REQUIRE_PR: ${{ inputs.require-pr }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        run: python scripts/protect_default_branches.py