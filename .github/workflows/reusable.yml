name: Reusable Cascade

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      admin-merge:
        required: false
        type: boolean
        default: false
      allow-self-merge:
        required: false
        type: boolean
        default: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate App token
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_OWNER: team-deepiri
        run: |
          python -m pip install --quiet PyJWT cryptography httpx
          python scripts/mint_github_app_token.py

      - name: Install dependencies
        run: |
          pip install -e .
          pip install rich httpx gitpython tomli

      - name: Run cascade
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ARGS=(--repo "${{ inputs.repo }}" --tag "${{ inputs.tag }}"
            --org team-deepiri --bump-type patch --no-confirm)
          if [ "${{ inputs.admin-merge }}" = "true" ]; then
            ARGS+=(--admin-merge)
          fi
          if [ "${{ inputs.allow-self-merge }}" = "true" ]; then
            ARGS+=(--allow-self-merge)
          fi
          deepiri-cascade cascade "${ARGS[@]}"
