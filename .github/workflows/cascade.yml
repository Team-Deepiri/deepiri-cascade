name: Cascade Update

on:
  repository_dispatch:
    types: [cascade-trigger]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository name'
        required: true
      tag:
        description: 'Version tag (tag trigger)'
        required: false
      sha:
        description: 'Commit SHA (push trigger)'
        required: false
      trigger:
        description: 'Trigger type: tag or push'
        required: false
        default: tag
      admin-merge:
        description: 'Fall back to admin merge when auto-merge is unavailable'
        required: false
        default: 'false'
        type: boolean
      allow-self-merge:
        description: 'Allow admin merge on deepiri-cascade itself (deploys to prod)'
        required: false
        default: 'false'
        type: boolean

env:
  ORG: team-deepiri
  CASCADE_REPO: deepiri-cascade

permissions:
  contents: write
  pull-requests: write

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate App token
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_APP_OWNER: ${{ env.ORG }}
        run: |
          python -m pip install --quiet PyJWT cryptography httpx
          python scripts/mint_github_app_token.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install rich httpx gitpython tomli networkx poetry

      - name: Verify toolchain
        run: |
          poetry --version
          deepiri-cascade --help >/dev/null

      - name: Get cascade info
        id: info
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            REPO="${{ github.event.client_payload.repo }}"
            TAG="${{ github.event.client_payload.tag }}"
            SHA="${{ github.event.client_payload.sha }}"
            TRIGGER="${{ github.event.client_payload.trigger }}"
            ADMIN_MERGE="${{ github.event.client_payload.admin-merge }}"
            ALLOW_SELF_MERGE="${{ github.event.client_payload.allow-self-merge }}"
          else
            REPO="${{ github.event.inputs.repo }}"
            TAG="${{ github.event.inputs.tag }}"
            SHA="${{ github.event.inputs.sha }}"
            TRIGGER="${{ github.event.inputs.trigger }}"
            ADMIN_MERGE="${{ github.event.inputs.admin-merge }}"
            ALLOW_SELF_MERGE="${{ github.event.inputs.allow-self-merge }}"
          fi
          if [ -z "$TRIGGER" ]; then
            if [ -n "$SHA" ]; then TRIGGER="push"; else TRIGGER="tag"; fi
          fi
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "trigger=$TRIGGER" >> $GITHUB_OUTPUT
          echo "admin_merge=$ADMIN_MERGE" >> $GITHUB_OUTPUT
          echo "allow_self_merge=$ALLOW_SELF_MERGE" >> $GITHUB_OUTPUT

      - name: Run cascade
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ARGS=(--repo "${{ steps.info.outputs.repo }}" --org ${{ env.ORG }} --bump-type patch --no-confirm)
          if [ "${{ steps.info.outputs.trigger }}" = "push" ]; then
            ARGS+=(--trigger push --sha "${{ steps.info.outputs.sha }}")
          else
            ARGS+=(--trigger tag --tag "${{ steps.info.outputs.tag }}")
          fi
          if [ "${{ steps.info.outputs.admin_merge }}" = "true" ]; then
            ARGS+=(--admin-merge)
          fi
          if [ "${{ steps.info.outputs.allow_self_merge }}" = "true" ]; then
            ARGS+=(--allow-self-merge)
          fi
          deepiri-cascade cascade "${ARGS[@]}"
